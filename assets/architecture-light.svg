<g><rect x="172" y="290" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="201.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p₂</text></g>
<g><rect x="238" y="290" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="267.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p₃</text></g>
<text x="333.0" y="317.0" text-anchor="middle" font-size="20" fill="#59636e">…</text>
<g><rect x="370" y="290" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="399.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p<tspan baseline-shift="sub" font-size="10">N</tspan></text></g>
<g opacity="0.45"><rect x="462" y="290" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/><text x="491.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₁</text></g>
<g opacity="0.45"><rect x="528" y="290" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/><text x="557.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₂</text></g>
<g opacity="0.45"><rect x="594" y="290" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/><text x="623.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₃</text></g>
<g opacity="0.45"><rect x="660" y="290" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/><text x="689.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₄</text></g>
<line x1="456" y1="311.0" x2="724" y2="311.0" stroke="#8250df" stroke-width="1.6"/>
<text x="590.0" y="354" text-anchor="middle" font-size="12.5" fill="#59636e">sliced off · never reach the heads</text>
<line x1="234.0" y1="332" x2="234.0" y2="400" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="404" width="388" height="64" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="234.0" y="432" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Detection heads · one prediction per patch</text>
<text x="234.0" y="453" text-anchor="middle" font-size="13" fill="#59636e">class (similarity to text queries) · box · objectness</text>
<rect x="482" y="404" width="236" height="64" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="600.0" y="432" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Text encoder</text>
<text x="600.0" y="453" text-anchor="middle" font-size="12.5" fill="#59636e">“skier”, “donut”, …</text>
<line x1="482" y1="436" x2="432" y2="436" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="762" y="54" font-size="13" font-weight="600" fill="#1f2328">What changes</text>
<text x="762" y="78" font-size="12.5" fill="#59636e">+ K × d parameters</text>
<text x="762" y="99" font-size="12.5" fill="#59636e">(4 × 768 = 3,072 for ViT-B)</text>
<text x="762" y="120" font-size="12.5" fill="#59636e">K = 0 → stock model</text>
<text x="762" y="141" font-size="12.5" fill="#59636e">heads, text tower: untouched</text>
</svg>
