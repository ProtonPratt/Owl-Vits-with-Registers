<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="Register tokens are appended to the image tokens, pass through the ViT encoder, and are sliced off before the detection heads">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818b98"/></marker></defs>
<text x="40" y="26" font-size="13" font-weight="600" fill="#59636e" letter-spacing="0.6">ENCODER INPUT</text>
<g><rect x="40" y="44" width="58" height="42" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="69.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">CLS</text></g>
<g><rect x="106" y="44" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="135.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p₁</text></g>
<g><rect x="172" y="44" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="201.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p₂</text></g>
<g><rect x="238" y="44" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="267.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p₃</text></g>
<text x="333.0" y="71.0" text-anchor="middle" font-size="20" fill="#59636e">…</text>
<g><rect x="370" y="44" width="58" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="399.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">p<tspan baseline-shift="sub" font-size="10">N</tspan></text></g>
<g><rect x="462" y="44" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="491.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₁</text></g>
<g><rect x="528" y="44" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="557.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₂</text></g>
<g><rect x="594" y="44" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="623.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₃</text></g>
<g><rect x="660" y="44" width="58" height="42" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="689.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">r₄</text></g>
<path d="M40 94 v6 H428 v-6" fill="none" stroke="#0969da" stroke-width="1.4"/><text x="234.0" y="117" text-anchor="middle" font-size="12.5" fill="#59636e">1 + N image tokens · pretrained embeddings</text>
<path d="M462 94 v6 H718 v-6" fill="none" stroke="#8250df" stroke-width="1.4"/><text x="590.0" y="117" text-anchor="middle" font-size="12.5" fill="#59636e">K = 4 registers · new, learnable</text>
<line x1="234.0" y1="126" x2="234.0" y2="164" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="590.0" y1="126" x2="590.0" y2="164" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="168" width="678" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="379.0" y="196" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">ViT image encoder (pretrained OWL-ViT / OWLv2 weights)</text>
<text x="379.0" y="217" text-anchor="middle" font-size="13" fill="#59636e">self-attention over all 1 + N + K tokens — registers give global computation somewhere to live</text>
<line x1="234.0" y1="232" x2="234.0" y2="268" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="590.0" y1="232" x2="590.0" y2="268" stroke="#818b98" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="40" y="262" font-size="13" font-weight="600" fill="#59636e" letter-spacing="0.6">ENCODER OUTPUT</text>
