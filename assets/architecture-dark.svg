<text x="40" y="26" font-size="13" font-weight="600" fill="#9198a1" letter-spacing="0.6">ENCODER INPUT</text>
<g><rect x="40" y="44" width="58" height="42" rx="8" fill="#3a2d00" stroke="#d29922" stroke-width="1.5"/><text x="69.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">CLS</text></g>
<g><rect x="106" y="44" width="58" height="42" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="135.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">p₁</text></g>
<g><rect x="172" y="44" width="58" height="42" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="201.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">p₂</text></g>
