<g opacity="0.45"><rect x="594" y="290" width="58" height="42" rx="8" fill="#2a1a4a" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="623.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">r₃</text></g>
<g opacity="0.45"><rect x="660" y="290" width="58" height="42" rx="8" fill="#2a1a4a" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="689.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">r₄</text></g>
<line x1="456" y1="311.0" x2="724" y2="311.0" stroke="#ab7df8" stroke-width="1.6"/>
<text x="590.0" y="354" text-anchor="middle" font-size="12.5" fill="#9198a1">sliced off · never reach the heads</text>
<line x1="234.0" y1="332" x2="234.0" y2="400" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="404" width="388" height="64" rx="12" fill="#0f2d1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="234.0" y="432" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">Detection heads · one prediction per patch</text>
<text x="234.0" y="453" text-anchor="middle" font-size="13" fill="#9198a1">class (similarity to text queries) · box · objectness</text>
<rect x="482" y="404" width="236" height="64" rx="12" fill="#3d1e00" stroke="#f0883e" stroke-width="1.5"/>
<text x="600.0" y="432" text-anchor="middle" font-size="15" font-weight="600" fill="#f0f6fc">Text encoder</text>
<text x="600.0" y="453" text-anchor="middle" font-size="12.5" fill="#9198a1">“skier”, “donut”, …</text>
<line x1="482" y1="436" x2="432" y2="436" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="762" y="54" font-size="13" font-weight="600" fill="#f0f6fc">What changes</text>
<text x="762" y="78" font-size="12.5" fill="#9198a1">+ K × d parameters</text>
<text x="762" y="99" font-size="12.5" fill="#9198a1">(4 × 768 = 3,072 for ViT-B)</text>
<text x="762" y="120" font-size="12.5" fill="#9198a1">K = 0 → stock model</text>
<text x="762" y="141" font-size="12.5" fill="#9198a1">heads, text tower: untouched</text>
