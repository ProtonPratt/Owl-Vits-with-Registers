<g><rect x="660" y="44" width="58" height="42" rx="8" fill="#2a1a4a" stroke="#ab7df8" stroke-width="1.5"/><text x="689.0" y="70.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">r₄</text></g>
<path d="M40 94 v6 H428 v-6" fill="none" stroke="#4493f8" stroke-width="1.4"/><text x="234.0" y="117" text-anchor="middle" font-size="12.5" fill="#9198a1">1 + N image tokens · pretrained embeddings</text>
<path d="M462 94 v6 H718 v-6" fill="none" stroke="#ab7df8" stroke-width="1.4"/><text x="590.0" y="117" text-anchor="middle" font-size="12.5" fill="#9198a1">K = 4 registers · new, learnable</text>
<line x1="234.0" y1="126" x2="234.0" y2="164" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="590.0" y1="126" x2="590.0" y2="164" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="168" width="678" height="64" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="379.0" y="196" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">ViT image encoder (pretrained OWL-ViT / OWLv2 weights)</text>
<text x="379.0" y="217" text-anchor="middle" font-size="13" fill="#9198a1">self-attention over all 1 + N + K tokens — registers give global computation somewhere to live</text>
<line x1="234.0" y1="232" x2="234.0" y2="268" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="590.0" y1="232" x2="590.0" y2="268" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
