<text x="333.0" y="317.0" text-anchor="middle" font-size="20" fill="#9198a1">…</text>
<g><rect x="370" y="290" width="58" height="42" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="399.0" y="316.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">p<tspan baseline-shift="sub" font-size="10">N</tspan></text></g>
